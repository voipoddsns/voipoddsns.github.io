    <meta property="og:description" content="Додаток для перегляду каталогу фільмів та серіалів на телевізорах, приставках і смартфонах.">

<body style="background: #1d1f20;">
    <script>
        window.youtube_lazy_load = true
    </script>

    <div class="welcome"></div>

    <div id="app">

    </div>

    <div class="no-network hide">
        <div class="no-network__title">Помилка</div>
        <div class="no-network__desc">Не вдалося завантажити файл: <span class="no-network__file"></span></div>
    </div>

    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>

    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
        var lampa_url     = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5); // Новое значение каждые 15 минут
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }

            return base + add
        }

        function putScript(scripts, onload, onerror){
            var add = function(src){
                console.log('Loader', 'try-load-script', src)

                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')

                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        console.log('Loader', 'Script loaded', e)

                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        trys++

                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')

                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src

                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=' + cache_version, function () {})
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true

            loadCurrentLampa()
        }

        if (typeof AndroidJS !== "undefined"
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                false,
                function(){}
            )

            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)

                    $('head').append('<link rel="stylesheet" href="' + css + '">')
                },
                function () {
                    putScript(
                        urlJoin(lampa_url, 'lampa-main/app.min.js?v=' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version)

                            $('head').append('<link rel="stylesheet" href="' + css + '">')

                            putScript(
                                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                                false,
                                function(){}
                            )
                        },
                        loadLocalLampa
                    )
                }
            )
        }
        else{
            loadCurrentLampa()
        }
    </script>

    
    <!-- ╔══════════════════════════════════════════════════════════════╗
         ║          LAMPA PLUGIN AUTO-LOADER                           ║
         ║  Кидайте .js файли у папку /plugins/ — вони завантажаться   ║
         ║  автоматично після старту Lampa.                            ║
         ║                                                              ║
         ║  Пріоритет пошуку маніфесту:                                ║
         ║    1) plugins/loader.php  (PHP, автосканування папки)        ║
         ║    2) plugins/plugins.json (статичний список, fallback)      ║
         ╚══════════════════════════════════════════════════════════════╝ -->
    <script>
    (function () {
        'use strict';

        var PLUGINS_PHP  = './plugins/loader.php';
        var PLUGINS_JSON = './plugins/plugins.json';
        var LOAD_TIMEOUT = 8000; // мс на завантаження одного плагіна

        // ── Завантажити один JS-файл і повернути Promise ─────────────
        function loadScript(src) {
            return new Promise(function (resolve, reject) {
                var el    = document.createElement('script');
                var timer = setTimeout(function () {
                    reject(new Error('Timeout: ' + src));
                }, LOAD_TIMEOUT);

                el.type    = 'text/javascript';
                el.async   = true;
                el.src     = src + '?v=' + cache_version;

                el.onload = function () {
                    clearTimeout(timer);
                    console.log('[PluginLoader] ✔ Завантажено:', src);
                    resolve(src);
                };
                el.onerror = function () {
                    clearTimeout(timer);
                    console.warn('[PluginLoader] ✘ Помилка:', src);
                    reject(new Error('Error loading: ' + src));
                };

                document.body.appendChild(el);
            });
        }

        // ── Завантажити плагіни послідовно (зберігає порядок) ────────
        function loadSequential(list) {
            return list.reduce(function (chain, plugin) {
                return chain.then(function () {
                    return loadScript(plugin.file).catch(function (err) {
                        // Не зупиняємо ланцюжок при помилці одного плагіна
                        console.error('[PluginLoader]', err.message);
                    });
                });
            }, Promise.resolve());
        }

        // ── Отримати маніфест (PHP або JSON) ─────────────────────────
        function fetchManifest(url) {
            return fetch(url + '?v=' + cache_version, {
                cache: 'no-store',
                headers: { 'Accept': 'application/json' }
            }).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            });
        }

        // ── Головна функція ───────────────────────────────────────────
        function startPluginLoader() {
            console.log('[PluginLoader] Старт сканування плагінів...');

            // Спочатку пробуємо PHP (автосканування), потім статичний JSON
            fetchManifest(PLUGINS_PHP)
                .catch(function () {
                    console.log('[PluginLoader] PHP недоступний, використовуємо plugins.json');
                    return fetchManifest(PLUGINS_JSON);
                })
                .then(function (manifest) {
                    var list = (manifest && manifest.plugins) || [];

                    if (!list.length) {
                        console.log('[PluginLoader] Плагінів не знайдено.');
                        return;
                    }

                    console.log('[PluginLoader] Знайдено плагінів:', list.length,
                        list.map(function(p){ return p.name || p.file; }));

                    return loadSequential(list);
                })
                .then(function () {
                    console.log('[PluginLoader] Всі плагіни завантажено.');
                })
                .catch(function (err) {
                    console.warn('[PluginLoader] Не вдалося отримати список плагінів:', err.message);
                });
        }

        // ── Чекаємо готовності Lampa, потім завантажуємо плагіни ─────
        // Lampa сигналізує через подію 'app' → type:'ready' або через window.Lampa
        var launched = false;

        function tryLaunch() {
            if (launched) return;

            if (window.Lampa && Lampa.Listener) {
                launched = true;

                Lampa.Listener.follow('app', function (e) {
                    if (e.type === 'ready') {
                        startPluginLoader();
                    }
                });

                // Якщо Lampa вже готова (ready вже відбувся)
                if (Lampa.Storage && Lampa.Storage.get) {
                    startPluginLoader();
                }
            }
        }

        // Перевіряємо кожні 200 мс поки Lampa не з'явиться (макс 30 сек)
        var checkInterval = setInterval(function () {
            tryLaunch();
        }, 200);

        setTimeout(function () {
            clearInterval(checkInterval);
            if (!launched) {
                console.warn('[PluginLoader] Lampa не запустилась за 30 сек — завантажуємо плагіни без очікування.');
                startPluginLoader();
            }
        }, 30000);

    })();
    </script>
</body>
</html>
