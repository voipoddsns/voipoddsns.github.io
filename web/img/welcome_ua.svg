<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#0057CC"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD500"/>
      <stop offset="100%" stop-color="#E8B800"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky (blue) -->
  <rect width="960" height="270" fill="url(#sky)"/>
  <!-- Field (yellow) -->
  <rect y="270" width="960" height="270" fill="url(#field)"/>

  <!-- Stars / bokeh dots on sky -->
  <circle cx="80" cy="60" r="2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="30" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="320" cy="90" r="2" fill="white" opacity="0.4"/>
  <circle cx="700" cy="45" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="850" cy="70" r="2" fill="white" opacity="0.5"/>
  <circle cx="920" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="450" cy="20" r="2.5" fill="white" opacity="0.3"/>
  <circle cx="580" cy="100" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="150" cy="130" r="1" fill="white" opacity="0.4"/>
  <circle cx="760" cy="120" r="2" fill="white" opacity="0.5"/>

  <!-- Sunflower stalks on yellow field -->
  <g opacity="0.5">
    <line x1="100" y1="540" x2="110" y2="350" stroke="#8B6914" stroke-width="3"/>
    <line x1="200" y1="540" x2="215" y2="330" stroke="#8B6914" stroke-width="3"/>
    <line x1="750" y1="540" x2="760" y2="340" stroke="#8B6914" stroke-width="3"/>
    <line x1="860" y1="540" x2="850" y2="360" stroke="#8B6914" stroke-width="3"/>
    <!-- Sunflower heads -->
    <circle cx="110" cy="345" r="18" fill="#8B4513" opacity="0.7"/>
    <circle cx="215" cy="325" r="20" fill="#8B4513" opacity="0.7"/>
    <circle cx="760" cy="335" r="18" fill="#8B4513" opacity="0.7"/>
    <circle cx="850" cy="355" r="16" fill="#8B4513" opacity="0.7"/>
    <!-- Petals -->
    <circle cx="110" cy="326" r="7" fill="#FFB300" opacity="0.8"/>
    <circle cx="110" cy="364" r="7" fill="#FFB300" opacity="0.8"/>
    <circle cx="91" cy="345" r="7" fill="#FFB300" opacity="0.8"/>
    <circle cx="129" cy="345" r="7" fill="#FFB300" opacity="0.8"/>
    <circle cx="97" cy="332" r="6" fill="#FFB300" opacity="0.7"/>
    <circle cx="123" cy="332" r="6" fill="#FFB300" opacity="0.7"/>
    <circle cx="97" cy="358" r="6" fill="#FFB300" opacity="0.7"/>
    <circle cx="123" cy="358" r="6" fill="#FFB300" opacity="0.7"/>
  </g>

  <!-- LAMPA Logo text in center -->
  <g filter="url(#glow)">
    <!-- Shadow -->
    <text x="483" y="253" text-anchor="middle" font-size="90" font-family="Arial Black, sans-serif"
          font-weight="900" fill="rgba(0,0,0,0.4)" letter-spacing="8">LAMPA</text>
    <!-- Blue top half -->
    <clipPath id="topHalf">
      <rect x="0" y="0" width="960" height="248"/>
    </clipPath>
    <text x="480" y="248" text-anchor="middle" font-size="90" font-family="Arial Black, sans-serif"
          font-weight="900" fill="#FFFFFF" letter-spacing="8" clip-path="url(#topHalf)">LAMPA</text>
    <!-- Yellow bottom half -->
    <clipPath id="botHalf">
      <rect x="0" y="248" width="960" height="100"/>
    </clipPath>
    <text x="480" y="248" text-anchor="middle" font-size="90" font-family="Arial Black, sans-serif"
          font-weight="900" fill="#FFD500" letter-spacing="8" clip-path="url(#botHalf)">LAMPA</text>
  </g>

  <!-- Subtitle -->
  <text x="480" y="295" text-anchor="middle" font-size="20" font-family="Arial, sans-serif"
        fill="rgba(255,255,255,0.75)" letter-spacing="4">МЕДІАПЛЕЄР  •  UKRAINIAN THEME  🇺🇦</text>

  <!-- Decorative divider line (flag stripe) -->
  <rect x="200" y="268" width="560" height="4" rx="2" fill="white" opacity="0.3"/>
</svg>
