  <circle cx="60" cy="100" r="7" fill="#005BBB"/>
  <circle cx="140" cy="100" r="7" fill="#005BBB"/>
  <circle cx="72.7" cy="72.7" r="7" fill="#FFD500"/>
  <circle cx="127.3" cy="72.7" r="7" fill="#FFD500"/>
  <circle cx="72.7" cy="127.3" r="7" fill="#FFD500"/>
  <circle cx="127.3" cy="127.3" r="7" fill="#FFD500"/>
