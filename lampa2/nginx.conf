server {
    listen 80;
    server_name _;

    root /var/www/lampa;
    index index.html;

    # Gzip-сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff font/woff2;

    # Статика — долгий кэш (ломается через ?v=... в index.html)
    location ~* \.(js|css|woff|woff2|ttf|eot|ogg|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # index.html — без кэша, всегда свежий
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # youtube.html — без кэша
    location = /youtube.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Все остальные запросы — на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
