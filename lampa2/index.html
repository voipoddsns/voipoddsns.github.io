<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lampa - Каталог фильмов и сериалов</title>

    <meta name="description" content="Приложение для просмотра каталога фильмов и сериалов на телевизорах, приставках и смартфонах.">
    <meta name="referrer" content="never">
    <meta name="theme-color" content="#1d1f20">

    <meta property="og:title" content="Lampa - Каталог фильмов и сериалов">
    <meta property="og:description" content="Приложение для просмотра каталога фільмів та серіалів.">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image" content="og.png">

    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="icons/favicon.ico">
    <link rel="manifest" href="icons/site.webmanifest" crossorigin="use-credentials">

    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">
    <link rel="stylesheet" href="css/app.css?v=4.56">

    <style>
        /* ── Общий оверлей ── */
        #lampa-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: #1d1f20;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            font-family: SegoeUI, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #lampa-overlay.hidden { display: none; }

        /* ── Экран выбора языка ── */
        #lang-screen { width: 100%; text-align: center; }
        #lang-screen h1 { color: #fff; font-size: 2em; margin: 0 0 .3em; font-weight: 300; }
        #lang-screen p  { color: #aaa; font-size: 1.1em; margin: 0 0 2em; }

        .lang-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: .8em; max-width: 720px; margin: 0 auto 2em;
            padding: 0 1em;
        }
        .lang-btn {
            background: #2a2d2f; border: 2px solid transparent;
            color: #fff; border-radius: 12px;
            padding: .7em 1.3em; cursor: pointer;
            font-size: 1em; transition: all .2s;
            display: flex; align-items: center; gap: .5em;
        }
        .lang-btn:hover   { background: #383c3f; border-color: #555; }
        .lang-btn.active  { border-color: #e2b616; background: #2e2a14; }
        .lang-btn .flag   { font-size: 1.4em; line-height: 1; }

        #lang-confirm {
            background: #e2b616; color: #1d1f20;
            border: none; border-radius: 10px;
            padding: .8em 2.5em; font-size: 1.1em; font-weight: 700;
            cursor: pointer; transition: opacity .2s;
        }
        #lang-confirm:hover { opacity: .85; }

        /* ── Кнопка управления плагинами ── */
        #plugin-toggle {
            position: fixed; bottom: 18px; right: 18px; z-index: 9000;
            background: #e2b616; color: #1d1f20;
            border: none; border-radius: 50%;
            width: 52px; height: 52px;
            font-size: 1.5em; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,.5);
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s, opacity .2s;
        }
        #plugin-toggle:hover { transform: scale(1.1); }

        /* ── Панель плагинов ── */
        #plugin-panel {
            position: fixed; bottom: 80px; right: 18px; z-index: 8999;
            background: #242729; border: 1px solid #3a3d40;
            border-radius: 16px; padding: 1.2em;
            width: min(420px, calc(100vw - 36px));
            box-shadow: 0 8px 40px rgba(0,0,0,.6);
            font-family: SegoeUI, sans-serif; color: #fff;
            display: none; flex-direction: column; gap: 1em;
        }
        #plugin-panel.open { display: flex; }
        #plugin-panel h3 { margin: 0; font-size: 1.1em; font-weight: 600; color: #e2b616; }

        .plugin-tabs {
            display: flex; gap: .5em;
        }
        .plugin-tab {
            flex: 1; padding: .5em; text-align: center;
            background: #2e3134; border: 1.5px solid transparent;
            border-radius: 8px; cursor: pointer; font-size: .9em;
            color: #ccc; transition: all .2s;
        }
        .plugin-tab.active { border-color: #e2b616; color: #e2b616; background: #2a2710; }

        .plugin-section { display: none; flex-direction: column; gap: .7em; }
        .plugin-section.active { display: flex; }

        .plugin-input {
            width: 100%; box-sizing: border-box;
            background: #1d1f20; border: 1px solid #444;
            color: #fff; border-radius: 8px;
            padding: .6em .8em; font-size: .9em;
        }
        .plugin-input:focus { outline: none; border-color: #e2b616; }

        .plugin-file-label {
            display: flex; align-items: center; justify-content: center; gap: .5em;
            border: 2px dashed #444; border-radius: 8px;
            padding: 1em; cursor: pointer; color: #aaa;
            font-size: .9em; transition: border-color .2s;
        }
        .plugin-file-label:hover { border-color: #e2b616; color: #e2b616; }
        #plugin-file-input { display: none; }

        .plugin-file-name { font-size: .85em; color: #aaa; text-align: center; }

        .plugin-btn-row { display: flex; gap: .5em; }
        .plugin-btn {
            flex: 1; padding: .6em; border: none; border-radius: 8px;
            cursor: pointer; font-size: .9em; font-weight: 600;
            transition: opacity .2s;
        }
        .plugin-btn:hover { opacity: .85; }
        .plugin-btn.primary { background: #e2b616; color: #1d1f20; }
        .plugin-btn.danger  { background: #c0392b; color: #fff; }

        #plugin-list { display: flex; flex-direction: column; gap: .5em; max-height: 200px; overflow-y: auto; }
        .plugin-item {
            display: flex; align-items: center; gap: .6em;
            background: #1d1f20; border-radius: 8px; padding: .6em .8em;
        }
        .plugin-item-icon { font-size: 1.2em; }
        .plugin-item-info { flex: 1; overflow: hidden; }
        .plugin-item-title { font-size: .9em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .plugin-item-url   { font-size: .75em; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .plugin-item-del   { background: none; border: none; color: #c0392b; font-size: 1.1em; cursor: pointer; padding: 0 .2em; }
        .plugin-empty { color: #888; font-size: .9em; text-align: center; padding: .5em; }

        .plugin-msg { font-size: .82em; padding: .4em .7em; border-radius: 6px; text-align: center; }
        .plugin-msg.ok  { background: #1a3a1a; color: #4caf50; }
        .plugin-msg.err { background: #3a1a1a; color: #f44336; }
    </style>
</head>
<body style="background:#1d1f20;">
    <script>window.youtube_lazy_load = true</script>

    <!-- ── Оверлей: выбор языка (первый запуск) ── -->
    <div id="lampa-overlay">
        <div id="lang-screen">
            <h1 id="lang-title">Ласкаво просимо</h1>
            <p  id="lang-sub">Виберіть мову / Выберите язык</p>
            <div class="lang-grid" id="lang-grid"></div>
            <button id="lang-confirm">Продовжити →</button>
        </div>
    </div>

    <!-- ── Кнопка плагинов ── -->
    <button id="plugin-toggle" title="Плагіни">🧩</button>

    <!-- ── Панель плагинов ── -->
    <div id="plugin-panel">
        <h3>🧩 Управління плагінами</h3>

        <div class="plugin-tabs">
            <div class="plugin-tab active" data-tab="url">🔗 За посиланням</div>
            <div class="plugin-tab" data-tab="file">📁 З файлу</div>
            <div class="plugin-tab" data-tab="list">📋 Встановлені</div>
        </div>

        <!-- Вкладка: URL -->
        <div class="plugin-section active" id="tab-url">
            <input class="plugin-input" id="plugin-url-name" placeholder="Назва плагіна" type="text">
            <input class="plugin-input" id="plugin-url-link" placeholder="https://example.com/plugin.js" type="url">
            <div class="plugin-btn-row">
                <button class="plugin-btn primary" id="btn-add-url">Встановити</button>
            </div>
            <div id="msg-url"></div>
        </div>

        <!-- Вкладка: Файл -->
        <div class="plugin-section" id="tab-file">
            <input class="plugin-input" id="plugin-file-name-input" placeholder="Назва плагіна" type="text">
            <label class="plugin-file-label" for="plugin-file-input">
                <span>📂</span>
                <span id="plugin-file-label-text">Оберіть .js файл</span>
            </label>
            <input type="file" id="plugin-file-input" accept=".js,application/javascript">
            <div class="plugin-btn-row">
                <button class="plugin-btn primary" id="btn-add-file">Встановити</button>
            </div>
            <div id="msg-file"></div>
        </div>

        <!-- Вкладка: Список -->
        <div class="plugin-section" id="tab-list">
            <div id="plugin-list"></div>
        </div>
    </div>

    <div class="welcome"></div>
    <div id="app"></div>
    <div class="no-network hide">
        <div class="no-network__title">Помилка</div>
        <div class="no-network__desc">Не вдалося завантажити: <span class="no-network__file"></span></div>
    </div>

    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.min.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
    (function () {
        'use strict';

        /* ═══════════════════════════════════════════════
           КОНФИГУРАЦИЯ
        ═══════════════════════════════════════════════ */
        var LANG_KEY          = 'language';
        var PLUGINS_KEY       = 'plugins';
        var FILE_PLUGINS_KEY  = 'lampa_file_plugins';
        var DEFAULT_LANG      = 'uk';

        var LANGUAGES = [
            { code:'uk', name:'Українська',  flag:'🇺🇦' },
            { code:'ru', name:'Русский',      flag:'🇷🇺' },
            { code:'en', name:'English',      flag:'🇬🇧' },
            { code:'be', name:'Беларуская',   flag:'🇧🇾' },
            { code:'bg', name:'Български',    flag:'🇧🇬' },
            { code:'cs', name:'Čeština',      flag:'🇨🇿' },
            { code:'fr', name:'Français',     flag:'🇫🇷' },
            { code:'he', name:'עִברִית',      flag:'🇮🇱' },
            { code:'pt', name:'Português',    flag:'🇵🇹' },
            { code:'ro', name:'Română',       flag:'🇷🇴' },
            { code:'zh', name:'简体中文',     flag:'🇨🇳' }
        ];

        var WELCOME = {
            uk: { title: 'Ласкаво просимо', sub: 'Виберіть мову' },
            ru: { title: 'Добро пожаловать', sub: 'Выберите язык' },
            en: { title: 'Welcome',          sub: 'Choose your language' },
            be: { title: 'Сардэчна запрашаем', sub: 'Выберыце мову' },
            bg: { title: 'Здравейте',        sub: 'Изберете вашият език' },
            cs: { title: 'Vítejte',          sub: 'Vyberte svůj jazyk' },
            fr: { title: 'Bienvenue',        sub: 'Choisissez votre langue' },
            he: { title: 'ברוך הבא',         sub: 'בחר את השפה שלך' },
            pt: { title: 'Bem-vindo',        sub: 'Escolhe o teu idioma' },
            ro: { title: 'Bun venit',        sub: 'Alegeți limba' },
            zh: { title: '欢迎',             sub: '选择你的语言' }
        };

        /* ═══════════════════════════════════════════════
           ХРАНИЛИЩЕ ПЛАГИНОВ
        ═══════════════════════════════════════════════ */
        function getUrlPlugins() {
            try { return JSON.parse(localStorage.getItem(PLUGINS_KEY) || '[]'); }
            catch(e) { return []; }
        }
        function setUrlPlugins(arr) {
            localStorage.setItem(PLUGINS_KEY, JSON.stringify(arr));
        }
        function getFilePlugins() {
            try { return JSON.parse(localStorage.getItem(FILE_PLUGINS_KEY) || '[]'); }
            catch(e) { return []; }
        }
        function setFilePlugins(arr) {
            localStorage.setItem(FILE_PLUGINS_KEY, JSON.stringify(arr));
        }

        /* ═══════════════════════════════════════════════
           ИНЖЕКТИРУЕМ ФАЙЛОВЫЕ ПЛАГИНЫ ДО ЗАГРУЗКИ APP
        ═══════════════════════════════════════════════ */
        (function injectFilePlugins() {
            getFilePlugins().forEach(function(p) {
                try {
                    var s = document.createElement('script');
                    s.textContent = p.content;
                    document.head.appendChild(s);
                } catch(e) { console.warn('Plugin inject error:', p.title, e); }
            });
        })();

        /* ═══════════════════════════════════════════════
           ЗАГРУЗКА ПРИЛОЖЕНИЯ
        ═══════════════════════════════════════════════ */
        var appLoaded = false;
        var cache_version = Math.floor((new Date()).getTime() / 9e5);

        function loadApp() {
            if (appLoaded) return;
            appLoaded = true;
            var s = document.createElement('script');
            var retries = 0;
            s.type = 'text/javascript';
            s.src = 'app.min.js?v=' + cache_version;
            s.onerror = function() {
                if (++retries < 3) { s.src = 'app.min.js?v=' + cache_version + '&r=' + retries; }
                else {
                    document.querySelector('.no-network').classList.remove('hide');
                    document.querySelector('.no-network__file').textContent = 'app.min.js';
                }
            };
            document.body.appendChild(s);
        }

        /* ═══════════════════════════════════════════════
           ЭКРАН ВЫБОРА ЯЗЫКА
        ═══════════════════════════════════════════════ */
        var selectedLang = DEFAULT_LANG;

        function buildLangScreen() {
            var grid = document.getElementById('lang-grid');
            LANGUAGES.forEach(function(l) {
                var btn = document.createElement('button');
                btn.className = 'lang-btn' + (l.code === DEFAULT_LANG ? ' active' : '');
                btn.innerHTML = '<span class="flag">' + l.flag + '</span>' + l.name;
                btn.dataset.code = l.code;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.remove('active'); });
                    btn.classList.add('active');
                    selectedLang = l.code;
                    var w = WELCOME[l.code] || WELCOME['en'];
                    document.getElementById('lang-title').textContent = w.title;
                    document.getElementById('lang-sub').textContent   = w.sub;
                });
                grid.appendChild(btn);
            });
        }

        function showLangScreen() {
            buildLangScreen();
            document.getElementById('lang-confirm').addEventListener('click', function() {
                localStorage.setItem(LANG_KEY, selectedLang);
                document.getElementById('lampa-overlay').classList.add('hidden');
                loadApp();
            });
        }

        function initLang() {
            var saved = localStorage.getItem(LANG_KEY);
            if (!saved) {
                showLangScreen();           // первый запуск
            } else {
                document.getElementById('lampa-overlay').classList.add('hidden');
                loadApp();
            }
        }

        /* ═══════════════════════════════════════════════
           МЕНЕДЖЕР ПЛАГИНОВ
        ═══════════════════════════════════════════════ */

        // Таб-переключатель
        document.querySelectorAll('.plugin-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                var name = tab.dataset.tab;
                document.querySelectorAll('.plugin-tab').forEach(function(t){ t.classList.remove('active'); });
                document.querySelectorAll('.plugin-section').forEach(function(s){ s.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById('tab-' + name).classList.add('active');
                if (name === 'list') renderPluginList();
            });
        });

        // Открыть/закрыть панель
        document.getElementById('plugin-toggle').addEventListener('click', function() {
            var panel = document.getElementById('plugin-panel');
            var isOpen = panel.classList.toggle('open');
            if (isOpen) {
                // показать активный таб
                var active = document.querySelector('.plugin-tab.active');
                if (active && active.dataset.tab === 'list') renderPluginList();
            }
        });

        // Закрыть панель кликом вне неё
        document.addEventListener('click', function(e) {
            var panel  = document.getElementById('plugin-panel');
            var toggle = document.getElementById('plugin-toggle');
            if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== toggle) {
                panel.classList.remove('open');
            }
        });

        // Сообщения
        function showMsg(id, text, type) {
            var el = document.getElementById(id);
            el.innerHTML = '<div class="plugin-msg ' + type + '">' + text + '</div>';
            setTimeout(function() { el.innerHTML = ''; }, 3000);
        }

        // ── Добавить по URL
        document.getElementById('btn-add-url').addEventListener('click', function() {
            var name = document.getElementById('plugin-url-name').value.trim();
            var url  = document.getElementById('plugin-url-link').value.trim();
            if (!url) { showMsg('msg-url', 'Вкажіть посилання', 'err'); return; }
            if (!url.match(/^https?:\/\//i)) { showMsg('msg-url', 'Посилання має починатись з http(s)://', 'err'); return; }
            var list = getUrlPlugins();
            if (list.some(function(p){ return p.url === url; })) {
                showMsg('msg-url', 'Плагін вже встановлено', 'err'); return;
            }
            list.push({ title: name || extractName(url), url: url });
            setUrlPlugins(list);
            document.getElementById('plugin-url-name').value = '';
            document.getElementById('plugin-url-link').value = '';
            showMsg('msg-url', '✓ Встановлено. Перезавантажте сторінку.', 'ok');
        });

        // ── Файл: обновить label
        var selectedFile = null;
        document.getElementById('plugin-file-input').addEventListener('change', function(e) {
            selectedFile = e.target.files[0] || null;
            document.getElementById('plugin-file-label-text').textContent =
                selectedFile ? selectedFile.name : 'Оберіть .js файл';
        });

        // ── Добавить из файла
        document.getElementById('btn-add-file').addEventListener('click', function() {
            if (!selectedFile) { showMsg('msg-file', 'Оберіть файл', 'err'); return; }
            var name = document.getElementById('plugin-file-name-input').value.trim()
                       || selectedFile.name.replace(/\.js$/i, '');
            var reader = new FileReader();
            reader.onload = function(ev) {
                var content = ev.target.result;
                var list = getFilePlugins();
                if (list.some(function(p){ return p.title === name; })) {
                    showMsg('msg-file', 'Плагін з такою назвою вже є', 'err'); return;
                }
                list.push({ title: name, content: content, size: selectedFile.size });
                setFilePlugins(list);
                document.getElementById('plugin-file-name-input').value = '';
                document.getElementById('plugin-file-label-text').textContent = 'Оберіть .js файл';
                selectedFile = null;
                document.getElementById('plugin-file-input').value = '';
                showMsg('msg-file', '✓ Встановлено. Перезавантажте сторінку.', 'ok');
            };
            reader.onerror = function() { showMsg('msg-file', 'Помилка читання файлу', 'err'); };
            reader.readAsText(selectedFile);
        });

        // ── Рендер списка плагинов
        function extractName(url) {
            try { return decodeURIComponent(url.split('/').pop().split('?')[0]) || url; }
            catch(e) { return url; }
        }

        function renderPluginList() {
            var container = document.getElementById('plugin-list');
            container.innerHTML = '';
            var urlPlugins  = getUrlPlugins();
            var filePlugins = getFilePlugins();
            var all = [];

            urlPlugins.forEach(function(p)  { all.push({ type:'url',  title: p.title || extractName(p.url), sub: p.url }); });
            filePlugins.forEach(function(p) { all.push({ type:'file', title: p.title, sub: '📁 ' + formatSize(p.size || p.content.length) }); });

            if (!all.length) {
                container.innerHTML = '<div class="plugin-empty">Плагіни не встановлені</div>';
                return;
            }

            all.forEach(function(p, i) {
                var item = document.createElement('div');
                item.className = 'plugin-item';
                item.innerHTML =
                    '<div class="plugin-item-icon">' + (p.type === 'url' ? '🔗' : '📁') + '</div>' +
                    '<div class="plugin-item-info">' +
                        '<div class="plugin-item-title">' + escHtml(p.title) + '</div>' +
                        '<div class="plugin-item-url">'   + escHtml(p.sub)   + '</div>' +
                    '</div>' +
                    '<button class="plugin-item-del" title="Видалити">🗑</button>';
                item.querySelector('.plugin-item-del').addEventListener('click', function() {
                    if (p.type === 'url') {
                        var list = getUrlPlugins();
                        list.splice(list.findIndex(function(x){ return (x.title||extractName(x.url)) === p.title && x.url === p.sub; }), 1);
                        setUrlPlugins(list);
                    } else {
                        var list = getFilePlugins();
                        list.splice(list.findIndex(function(x){ return x.title === p.title; }), 1);
                        setFilePlugins(list);
                    }
                    renderPluginList();
                });
                container.appendChild(item);
            });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' Б';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' КБ';
            return (bytes/1024/1024).toFixed(2) + ' МБ';
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /* ── Запуск ── */
        initLang();

    })();
    </script>
</body>
</html>
